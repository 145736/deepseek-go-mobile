<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#f8f8f6" />
    <script>
      (() => {
        let preference
        try { preference = localStorage.getItem('chat-demo:theme-preference') } catch {}
        const dark = preference === 'dark' || (preference !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        const color = dark ? '#000000' : '#f8f8f6'
        document.documentElement.style.backgroundColor = color
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        document.querySelector('meta[name="theme-color"]').content = color
      })()
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="DeepSeek 随行" />
    <meta name="description" content="DeepSeek 随行：在自己的设备上聊天、搜索、阅读和思考。" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <title>DeepSeek 随行</title>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
